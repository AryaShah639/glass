<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Glasmacher — A Glassblowing Game</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #080604;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; touch-action: none;
    font-family: Georgia, 'Times New Roman', serif;
  }
  canvas {
    max-width: 100vw; max-height: 100vh;
    aspect-ratio: 3 / 2;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(255,140,40,0.08);
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="640"></canvas>
<script>
'use strict';

/* ============================== setup ============================== */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = cvs.width, H = cvs.height;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt   = n => '$' + Math.round(n);

/* ============================== audio ============================== */

let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  return AC;
}
function beep(freq = 440, dur = 0.08, type = 'sine', vol = 0.12) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(ac.destination);
  const now = ac.currentTime;
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + dur);
  o.start(now); o.stop(now + dur);
}
function noiseBurst(dur = 0.3, vol = 0.25, lowpass = 0) {
  const ac = audio(); if (!ac) return;
  const len = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = ac.createBufferSource(), g = ac.createGain();
  src.buffer = buf;
  let node = src;
  if (lowpass) {
    const f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = lowpass;
    src.connect(f); node = f;
  }
  node.connect(g); g.connect(ac.destination);
  g.gain.value = vol;
  src.start();
}

/* ============================== content ============================== */

const COLORS = {
  clear:  { name: 'Clear',     price: 0,   base: 22,  glass: '#cfeaf4', lite: '#ffffff', dark: '#8fb8c4' },
  sea:    { name: 'Sea Green', price: 0,   base: 30,  glass: '#7fd4b0', lite: '#d6ffe9', dark: '#4a8f6f' },
  cobalt: { name: 'Cobalt',    price: 70,  base: 46,  glass: '#4f7ff0', lite: '#a9c4ff', dark: '#2c4a99' },
  amber:  { name: 'Amber',     price: 160, base: 62,  glass: '#f0a63c', lite: '#ffd894', dark: '#9c6415' },
  ruby:   { name: 'Ruby',      price: 380, base: 84,  glass: '#e84a5f', lite: '#ff9fae', dark: '#93202f' },
  gold:   { name: 'Gold Leaf', price: 850, base: 120, glass: '#ffd75e', lite: '#fff3bf', dark: '#b8912a' },
};

const SIZES = {
  small:  { name: 'Small',  target: 40, mult: 1.0  },
  medium: { name: 'Medium', target: 56, mult: 1.25 },
  large:  { name: 'Large',  target: 74, mult: 1.55 },
};

const SHAPES = {
  ornament: { name: 'Ornament', taps: 1, mult: 0.85 },
  bottle:   { name: 'Bottle',   taps: 2, mult: 1.15 },
  bowl:     { name: 'Bowl',     taps: 2, mult: 1.3  },
  vase:     { name: 'Vase',     taps: 3, mult: 1.6  },
};

const UPGRADES = [
  { key: 'tongs', name: 'Jacks',    desc: 'Wider shaping zones.', costs: [130, 340] },
  { key: 'hose',  name: 'Blowhose', desc: 'Glass cools slower.',  costs: [110, 280] },
  { key: 'gauge', name: 'Calipers', desc: 'Shows the exact target size while blowing.', costs: [160] },
];

const ANN_WINDOW = { lo: 45, hi: 62, center: 53.5 };

const SAVE_KEY = 'glasmacher_save_v2';

let save = {
  money: 0, unlocked: ['clear', 'sea'], done: 0, fail: 0, best: 0, streak: 0,
  up: { tongs: 0, hose: 0, gauge: 0 },
};

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.money === 'number') {
        save = { ...save, ...s, up: { ...save.up, ...(s.up || {}) } };
      }
    }
  } catch (e) {}
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}

/* ============================== state ============================== */

const PHASE_TITLE = 'title';
const PHASE_SHOP = 'shop';
const PHASE_HEAT = 'heat';
const PHASE_BLOW = 'blow';
const PHASE_SHAPE = 'shape';
const PHASE_ANNEAL = 'anneal';
const PHASE_RESULT = 'result';

const game = {
  phase: PHASE_TITLE,
  time: 0,
  holding: false,
  heatArmed: false,
  order: null,
  temp: 0,
  size: 0,
  scores: {},
  tapsDone: 0,
  zones: [],
  pointer: 0.5,
  pointerDir: 1,
  message: '',
  sparks: [],
  shards: [],
  embers: [],
  glow: 0.45,
  shake: 0,
  fail: false,
  pay: 0,
  streakBonus: 0,
  rating: '',
  clickable: [],
  ease: {},
  moneyShown: 0,
  whooshT: 0,
  flash: 0,
};

function difficulty() {
  return Math.min(1, save.done / 25);
}
function skillTitle() {
  const d = save.done;
  return d < 6 ? 'Apprentice' : d < 15 ? 'Journeyman' : d < 26 ? 'Artisan' : 'Master Glazier';
}

function makeOrder() {
  const colors = save.unlocked.filter(k => COLORS[k]);
  const shapeKeys = Object.keys(SHAPES).slice(0, clamp(1 + Math.floor(save.done / 2), 1, 4));
  return {
    color: pick(colors),
    size: pick(Object.keys(SIZES)),
    shape: pick(shapeKeys),
  };
}
function orderPay(o) {
  const diffBonus = 1 + 0.3 * difficulty();
  return Math.round(COLORS[o.color].base * SIZES[o.size].mult * SHAPES[o.shape].mult * diffBonus);
}

function spawnEmber() {
  game.embers.push({
    x: rand(150, 240), y: rand(230, 290),
    vx: rand(-14, 14), vy: rand(-46, -18),
    life: rand(1.2, 2.6), t: 0, r: rand(1, 2.6),
    col: Math.random() < 0.6 ? '#ffcf6b' : '#ff8f3c',
  });
}
function sparks(x, y, n, hue) {
  for (let i = 0; i < n; i++) {
    game.sparks.push({
      x, y, vx: rand(-60, 60), vy: rand(-160, -30),
      life: rand(0.3, 0.8), t: 0,
      col: hue || (Math.random() < 0.5 ? '#ffcf6b' : '#ff9a3c'),
    });
  }
}
function sparkleAt(x, y) {
  game.sparks.push({
    x, y, vx: rand(-40, 40), vy: rand(-90, -20),
    life: rand(0.4, 0.9), t: 0, r: rand(1.5, 3),
    col: pick(['#fff3bf', '#ffd75e', '#ffffff']),
  });
}
function shatter(x, y, colorKey) {
  const c = COLORS[colorKey] || COLORS.clear;
  for (let i = 0; i < 30; i++) {
    game.shards.push({
      x, y, vx: rand(-280, 280), vy: rand(-340, 60),
      life: rand(0.5, 1.2), t: 0, r: rand(2, 6), col: c.glass,
    });
  }
}

/* ============================== phases ============================== */

function goShop(fresh = true) {
  game.phase = PHASE_SHOP;
  game.fail = false;
  if (fresh) game.order = makeOrder();
}
function startOrder() {
  game.order = game.order || makeOrder();
  game.temp = 0; game.size = 0;
  game.scores = {}; game.tapsDone = 0;
  game.sparks = []; game.shards = [];
  game.pointer = 0.5; game.pointerDir = 1;
  game.fail = false;
  game.heatArmed = false;
  game.phase = PHASE_HEAT;
  beep(220, 0.15, 'triangle', 0.1);
}
function crackFail(msg) {
  game.fail = true;
  game.message = msg;
  noiseBurst(0.35, 0.3);
  shatter(W / 2, 370, game.order.color);
  game.shake = 12;
  save.streak = 0;
  finishOrder();
}
function popFail() {
  game.fail = true;
  game.message = 'POP! The bubble burst.';
  noiseBurst(0.4, 0.35, 900);
  shatter(W / 2, 370, game.order.color);
  game.shake = 14;
  game.flash = 0.5;
  save.streak = 0;
  finishOrder();
}
function finishOrder() {
  game.phase = PHASE_RESULT;
  const o = game.order;
  game.streakBonus = 0;
  if (game.fail) {
    game.pay = 0;
    game.rating = 'Ruined';
    game.scores = { heat: game.scores.heat || 0, blow: game.scores.blow || 0, shape: game.scores.shape || 0, anneal: game.scores.anneal || 0 };
    save.fail++;
  } else {
    const q = quality(o);
    let pay = Math.round(orderPay(o) * q / 100);
    if (q >= 70) { save.streak++; } else { save.streak = 0; }
    const streakMult = 1 + 0.05 * Math.min(save.streak, 10);
    game.streakBonus = Math.round(pay * (streakMult - 1));
    game.pay = pay + game.streakBonus;
    if (q >= 92) game.pay = Math.round(game.pay * 1.25);
    game.rating = q >= 92 ? 'Masterwork!' : q >= 80 ? 'Fine work' : q >= 60 ? 'Decent' : q >= 40 ? 'Rough' : 'Barely glass';
    save.money += game.pay;
    save.done++;
    save.best = Math.max(save.best, q);
    beep(520, 0.1, 'triangle', 0.12);
    setTimeout(() => beep(660, 0.12, 'triangle', 0.12), 110);
    if (q >= 92) setTimeout(() => beep(880, 0.2, 'triangle', 0.12), 240);
  }
  persist();
}
function quality(o) {
  const s = game.scores;
  return Math.round((s.heat + s.blow * 1.2 + s.shape + s.anneal) / 4.2);
}

function beginBlow() {
  game.phase = PHASE_BLOW;
  game.size = 8;
  beep(300, 0.08, 'sine', 0.08);
}
function beginShape() {
  game.phase = PHASE_SHAPE;
  game.tapsDone = 0;
  const n = SHAPES[game.order.shape].taps;
  const widen = 1 + save.up.tongs * 0.35;
  const tighten = 1 - 0.18 * difficulty();
  game.zones = [];
  for (let i = 0; i < n; i++) {
    const half = [0.17, 0.12, 0.085][i] * widen * tighten;
    game.zones.push({ c: rand(0.3, 0.7), half });
  }
  beep(440, 0.08, 'square', 0.07);
}
function beginAnneal() {
  game.phase = PHASE_ANNEAL;
  game.temp = clamp(game.temp, 40, 95);
  beep(180, 0.15, 'sine', 0.1);
}

/* ============================== input ============================== */

function onPress() {
  if (audio() && AC.state === 'suspended') AC.resume();
  const ph = game.phase;
  if (ph === PHASE_TITLE || ph === PHASE_RESULT) {
    goShop(true);
    beep(330, 0.08, 'triangle', 0.1);
    return;
  }
  if (ph === PHASE_SHOP) {
    if (mouse.x < 0) { startOrder(); return; }
    for (const c of game.clickable) {
      if (c.act && pointIn(c, mouse.x, mouse.y)) { c.act(); return; }
    }
    return;
  }
  if (ph === PHASE_HEAT) { game.heatArmed = true; return; }
  if (ph === PHASE_BLOW) return;
  if (ph === PHASE_SHAPE) return shapeTap();
  if (ph === PHASE_ANNEAL) return annealTap();
}

function shapeTap() {
  const z = game.zones[game.tapsDone];
  const dist = Math.abs(game.pointer - z.c);
  let s;
  if (dist <= z.half) s = Math.round(100 - (dist / z.half) * 45);
  else { s = 8; game.shake = 6; beep(120, 0.15, 'sawtooth', 0.1); }
  game.scores.shape = Math.round(((game.scores.shape || 0) * game.tapsDone + s) / (game.tapsDone + 1));
  game.tapsDone++;
  if (s > 8) beep(440 + game.tapsDone * 110, 0.07, 'square', 0.1);
  sparks(W / 2 + rand(-30, 30), 340 + rand(-20, 20), 5, '#bfe8ff');
  if (game.tapsDone >= game.zones.length) {
    setTimeout(() => { if (game.phase === '_shaping') beginAnneal(); }, 350);
    game.phase = '_shaping';
  }
}

function annealTap() {
  const t = game.temp;
  if (t < 22) return crackFail('Thermal shock! It shattered as it touched the kiln.');
  let s;
  if (t >= ANN_WINDOW.lo && t <= ANN_WINDOW.hi) s = Math.round(100 - Math.abs(t - ANN_WINDOW.center) * 2.2);
  else if (t > 70) { s = 22; game.shake = 6; }
  else s = 15;
  game.scores.anneal = s;
  beep(240, 0.12, 'sine', 0.1);
  finishOrder();
}

function onRelease() {
  if (audio() && AC.state === 'suspended') AC.resume();
  const ph = game.phase;
  if (ph === PHASE_HEAT) {
    if (!game.heatArmed) return;
    game.heatArmed = false;
    const t = game.temp;
    if (t >= 108) return crackFail('The gather dripped off the pipe!');
    const err = Math.abs(t - 80);
    game.scores.heat = Math.round(clamp(100 - Math.max(0, err - 10) * 4, 0, 100));
    beginBlow();
    return;
  }
  if (ph === PHASE_BLOW) {
    const target = SIZES[game.order.size].target;
    const err = Math.abs(game.size - target);
    game.scores.blow = Math.round(clamp(100 - Math.max(0, err - 7) * 5, 0, 100));
    beginShape();
  }
}

const mouse = { x: 0, y: 0 };
function canvasPos(e) {
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
function pointIn(rect, x, y) {
  return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
}
cvs.addEventListener('pointerdown', e => {
  const p = canvasPos(e);
  mouse.x = p.x; mouse.y = p.y;
  game.holding = true;
  onPress();
});
window.addEventListener('pointerup', () => { game.holding = false; onRelease(); });
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    mouse.x = -1; mouse.y = -1;
    game.holding = true;
    onPress();
  }
});
window.addEventListener('keyup', e => {
  if (e.code === 'Space' || e.code === 'Enter') { game.holding = false; onRelease(); }
});

/* ============================== update ============================== */

function update(dt) {
  game.time += dt;
  game.shake = Math.max(0, game.shake - dt * 30);
  game.flash = Math.max(0, game.flash - dt * 1.6);
  const burning = game.phase === PHASE_HEAT && game.holding;
  game.glow = lerp(game.glow, burning ? 1 : 0.45, dt * 4);
  game.moneyShown = lerp(game.moneyShown, save.money, dt * 8);

  for (let i = game.sparks.length - 1; i >= 0; i--) {
    const s = game.sparks[i];
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 340 * dt;
    if (s.t > s.life) game.sparks.splice(i, 1);
  }
  for (let i = game.shards.length - 1; i >= 0; i--) {
    const s = game.shards[i];
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt;
    if (s.t > s.life) game.shards.splice(i, 1);
  }
  for (let i = game.embers.length - 1; i >= 0; i--) {
    const s = game.embers[i];
    s.t += dt; s.x += s.vx * dt + Math.sin(game.time * 3 + s.y * 0.05) * 10 * dt;
    s.y += s.vy * dt;
    if (s.t > s.life) game.embers.splice(i, 1);
  }
  if (Math.random() < dt * 6) spawnEmber();

  const diff = difficulty();
  const hoseFactor = 1 - save.up.hose * 0.13;
  const coolRate = 11 * hoseFactor * (1 + 0.3 * diff);

  if (game.phase === PHASE_HEAT && game.holding) {
    game.whooshT += dt;
    if (game.whooshT > 0.25) {
      game.whooshT = 0;
      noiseBurst(0.08, 0.03, 700);
    }
  }

  if (game.phase === PHASE_BLOW && game.holding) {
    game.whooshT += dt;
    if (game.whooshT > 0.14) {
      game.whooshT = 0;
      noiseBurst(0.1, 0.035, 1400);
    }
  }

  const ph = game.phase;

  if (ph === PHASE_HEAT) {
    if (game.holding) {
      const flicker = 1 + Math.sin(game.time * 7) * 0.06 + Math.sin(game.time * 13.7) * 0.04;
      game.temp += dt * 46 * flicker * (1 + game.temp / 130);
      if (game.temp > 70 && Math.random() < dt * 22) sparks(rand(150, 240), rand(300, 330), 1);
      if (game.temp >= 110) {
        game.temp = 110;
        crackFail('Too hot — the gather collapsed!');
      }
    }
  } else if (ph === PHASE_BLOW) {
    game.temp = Math.max(0, game.temp - dt * coolRate);
    if (!game.holding && game.temp < 4) return crackFail('Left too long — the glass went cold and cracked!');
    if (game.holding) {
      game.size += dt * 30 * (0.55 + game.temp / 160);
      if (Math.random() < dt * 6) sparks(W / 2 + rand(-20, 20), 370, 1, '#cfeaf4');
      if (game.temp < 18) return crackFail('Too cold — the glass cracked!');
      if (game.size > SIZES[game.order.size].target * 1.30) game.shake = Math.max(game.shake, 3);
      if (game.size > SIZES[game.order.size].target * 1.38) return popFail();
    }
  } else if (ph === PHASE_SHAPE || ph === '_shaping') {
    game.temp = Math.max(0, game.temp - dt * coolRate * 0.8);
    const speed = (0.5 + 0.28 * game.tapsDone) * (1 + 0.4 * diff);
    if (ph === PHASE_SHAPE) {
      game.pointer += game.pointerDir * dt * speed;
      if (game.pointer > 1) { game.pointer = 1; game.pointerDir = -1; }
      if (game.pointer < 0) { game.pointer = 0; game.pointerDir = 1; }
    }
    if (game.temp < 10 && !game.fail) return crackFail('Too cold — the glass cracked while shaping!');
  } else if (ph === PHASE_ANNEAL) {
    game.temp = Math.max(0, game.temp - dt * 42 * (1 + 0.35 * diff));
  }
}

/* ============================== drawing helpers ============================== */

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

let wallPattern = null;
function buildWall() {
  const p = document.createElement('canvas');
  p.width = 96; p.height = 48;
  const pc = p.getContext('2d');
  pc.fillStyle = '#28201a';
  pc.fillRect(0, 0, 96, 48);
  const drawBrick = (x, y, w, h, i) => {
    const tone = 0.9 + (i % 7) * 0.02;
    pc.fillStyle = `rgb(${Math.round(62 * tone)},${Math.round(48 * tone)},${Math.round(38 * tone)})`;
    pc.fillRect(x + 1, y + 1, w - 2, h - 2);
    pc.fillStyle = 'rgba(255,220,180,0.05)';
    pc.fillRect(x + 1, y + 1, w - 2, 2);
  };
  drawBrick(0, 0, 46, 22, 0); drawBrick(48, 0, 46, 22, 1); drawBrick(94, 0, 2, 22, 7);
  drawBrick(-24, 24, 46, 22, 2); drawBrick(24, 24, 46, 22, 3); drawBrick(72, 24, 46, 22, 4);
  wallPattern = ctx.createPattern(p, 'repeat');
}

function drawBackground() {
  ctx.fillStyle = '#120d09';
  ctx.fillRect(0, 0, W, H);
  if (!wallPattern && typeof document !== 'undefined' && document.createElement) buildWall();
  if (wallPattern) {
    ctx.fillStyle = wallPattern;
    ctx.fillRect(0, 0, W, 480);
  }

  const wallShade = ctx.createLinearGradient(0, 0, 0, 480);
  wallShade.addColorStop(0, 'rgba(0,0,0,0.55)');
  wallShade.addColorStop(0.75, 'rgba(0,0,0,0.1)');
  wallShade.addColorStop(1, 'rgba(0,0,0,0.45)');
  ctx.fillStyle = wallShade;
  ctx.fillRect(0, 0, W, 480);

  drawTools();

  ctx.fillStyle = '#241a12';
  ctx.fillRect(0, 480, W, H - 480);
  ctx.fillStyle = 'rgba(255,190,110,0.07)';
  ctx.fillRect(0, 480, W, 4);
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i % 2 ? 'rgba(0,0,0,0.18)' : 'rgba(255,200,140,0.03)';
    ctx.fillRect(0, 496 + i * 30, W, 28);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0, 494 + i * 30, W, 2);
  }

  const vg = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawTools() {
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 3;
  const drawPaddle = (x, y) => {
    ctx.beginPath();
    ctx.ellipse(x, y + 26, 11, 22, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x, y + 50); ctx.stroke();
    ctx.fillStyle = '#0d0906'; ctx.fillRect(x - 7, y - 8, 14, 8);
  };
  const drawJacks = (x, y) => {
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 6); ctx.lineTo(x, y + 30);
    ctx.moveTo(x + 16, y - 6); ctx.lineTo(x, y + 30);
    ctx.moveTo(x - 16, y - 6); ctx.lineTo(x - 14, y - 16);
    ctx.moveTo(x + 16, y - 6); ctx.lineTo(x + 14, y - 16);
    ctx.stroke();
  };
  const drawShears = (x, y) => {
    ctx.beginPath();
    ctx.moveTo(x - 12, y + 26); ctx.lineTo(x + 4, y - 10);
    ctx.moveTo(x + 12, y + 26); ctx.lineTo(x - 4, y - 10);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(x - 10, y + 30, 5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 10, y + 30, 5, 0, Math.PI * 2); ctx.stroke();
  };
  drawPaddle(560, 240); drawJacks(650, 250); drawShears(740, 248);
}

function easeMarker(id, frac, dt = 0.016) {
  const cur = game.ease[id] == null ? frac : game.ease[id];
  const next = lerp(cur, frac, dt * 14);
  game.ease[id] = next;
  return next;
}

function drawFurnace() {
  const fx = 190, fy = 340;
  const glow = game.glow;

  const rg = ctx.createRadialGradient(fx, fy - 30, 10, fx, fy - 30, 260);
  rg.addColorStop(0, `rgba(255,140,40,${0.28 * glow})`);
  rg.addColorStop(1, 'rgba(255,140,40,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(fx - 260, fy - 290, 520, 520);

  for (const e of game.embers) {
    ctx.globalAlpha = clamp(1 - e.t / e.life, 0, 1) * 0.8;
    ctx.fillStyle = e.col;
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const flick = 0.94 + Math.sin(game.time * 9) * 0.04 + Math.sin(game.time * 23.3) * 0.02;

  ctx.beginPath();

    const yy = fy - 96 + r * 27;

  }

  ctx.fillStyle = '#25180e';
  roundRect(fx - 100, fy - 150, 200, 216, 18);
  ctx.fill();

  const breathe = glow * flick;
  const og = ctx.createRadialGradient(fx, fy - 30, 4, fx, fy - 30, 95);
  og.addColorStop(0, `rgba(255,240,190,${0.95 * breathe})`);
  og.addColorStop(0.35, `rgba(255,160,50,${0.9 * breathe})`);
  og.addColorStop(0.75, `rgba(190,60,15,${0.6 * breathe})`);
  og.addColorStop(1, 'rgba(60,18,8,0.15)');
  ctx.fillStyle = og;
  roundRect(fx - 74, fy - 104, 148, 158, 38);
  ctx.fill();

  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  roundRect(fx - 76, fy - 106, 152, 16, 6);
  ctx.fill();
  ctx.fillStyle = `rgba(255,220,150,${0.5 * glow})`;
  roundRect(fx - 70, fy - 104, 140, 5, 2);
  ctx.fill();

  ctx.fillStyle = '#0c0906';
  ctx.font = 'bold 11px Georgia';
  ctx.textAlign = 'center';
  ctx.save();

function tempColor(t) {
  if (t > 100) return [255, 240, 200];
  if (t > 80) return [255, 200, 110];
  if (t > 55) return [255, 150, 60];
  if (t > 30) return [230, 100, 50];
  return [170, 70, 50];
}

function glassFill(t, colorKey) {
  const c = COLORS[colorKey] || COLORS.clear;
  const coldMix = clamp((60 - t) / 60, 0, 1);
  const [r, g, b] = tempColor(t);
  return {
    fill: `rgba(${Math.round(lerp(r, 150, coldMix))},${Math.round(lerp(g, 205, coldMix))},${Math.round(lerp(b, 225, coldMix))},${0.85 + 0.1 * (1 - coldMix)})`,
    coldMix,
  };
}

function drawPieceShadow(cx, cy, w) {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(cx, cy + 10, w * 0.55, 10, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawMoltenGather() {
  const gx = W / 2, gy = 370;
  const t = game.temp;
  const { fill } = glassFill(t, game.order.color);
  const rad = 13 + game.size * (game.phase === PHASE_BLOW || game.phase === PHASE_SHAPE || game.phase === '_shaping' ? 1 : 0.4);

  drawPieceShadow(gx, gy + rad - 6, rad);

  ctx.save();
  if (t > 40) {
    const rg = ctx.createRadialGradient(gx, gy, 5, gx, gy, rad + 46);
    rg.addColorStop(0, `rgba(255,160,60,${0.35 * Math.min(1, t / 90)})`);
    rg.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(gx - rad - 60, gy - rad - 60, (rad + 60) * 2, (rad + 60) * 2);
  }

  if (game.phase === PHASE_SHAPE || game.phase === '_shaping') {
    const p = clamp(game.tapsDone / Math.max(1, game.zones.length), 0, 1);
    drawMorph(gx, gy, fill, game.order.shape, SIZES[game.order.size].target, p);
  } else {
    const wob = Math.sin(game.time * 5) * (game.phase === PHASE_BLOW && game.holding ? 3 : 1);
    const grad = ctx.createRadialGradient(gx - rad * 0.3, gy - rad * 0.4, rad * 0.15, gx, gy, rad);
    grad.addColorStop(0, 'rgba(255,255,255,0.85)');
    grad.addColorStop(0.25, fill);
    grad.addColorStop(1, t > 30 ? 'rgba(190,40,10,0.9)' : 'rgba(90,60,50,0.95)');
    ctx.beginPath();
    ctx.ellipse(gx, gy, rad + wob * 0.5, rad - wob * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = `rgba(255,180,90,${0.5 * Math.min(1, t / 80)})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(gx - rad * 0.32, gy - rad * 0.38, rad * 0.22, rad * 0.13, -0.7, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fill();
  }
  ctx.restore();
}

function drawMorph(cx, cy, col, shapeKey, target, p) {
  const dims = shapeDims(shapeKey, target);
  const r0 = 21;
  const rx = lerp(r0, dims.w / 2, p);
  const ry = lerp(r0, dims.h / 2, p);
  const wob = (1 - p) * Math.sin(game.time * 5) * 2;
  const grad = ctx.createRadialGradient(cx - rx * 0.3, cy - ry * 0.4, Math.max(2, rx * 0.15), cx, cy, Math.max(rx, ry));
  grad.addColorStop(0, 'rgba(255,255,255,0.7)');
  grad.addColorStop(0.3, col);
  grad.addColorStop(1, 'rgba(80,110,130,0.9)');
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx + wob, ry - wob, 0, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function shapeDims(shape, size) {
  switch (shape) {
    case 'ornament': return { w: size * 2.0, h: size * 2.0 };
    case 'bottle':   return { w: size * 1.5, h: size * 2.6 };
    case 'bowl':     return { w: size * 2.3, h: size * 1.35 };
    case 'vase':     return { w: size * 1.8, h: size * 2.4 };
  }
  return { w: size * 2, h: size * 2 };
}

function drawPiece(cx, cy, colorKey, shapeKey, size, cracked, alpha) {
  const c = COLORS[colorKey];
  const dims = shapeDims(shapeKey, size);
  const w = dims.w, h = dims.h;
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;

  drawPieceShadow(cx, cy + h / 2 + 6, w);
  const rg = ctx.createRadialGradient(cx, cy, 4, cx, cy, Math.max(w, h));
  rg.addColorStop(0, 'rgba(255,220,160,0.16)');
  rg.addColorStop(1, 'rgba(255,220,160,0)');
  ctx.fillStyle = rg;
  ctx.fillRect(cx - w, cy - h, w * 2, h * 2);

  const grad = ctx.createLinearGradient(cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2);
  grad.addColorStop(0, c.lite);
  grad.addColorStop(0.45, c.glass);
  grad.addColorStop(1, c.dark);

  ctx.fillStyle = grad;
  ctx.strokeStyle = c.dark;
  ctx.lineWidth = 3;

  if (shapeKey === 'ornament') {
    ctx.beginPath();
    ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.lite;
    roundRect(cx - 9, cy - h / 2 - 16, 18, 18, 4);
    ctx.fill();
  } else if (shapeKey === 'bottle') {
    const nw = w * 0.34, bh = h * 0.72, nh = h - bh;
    ctx.beginPath();
    ctx.moveTo(cx - nw / 2, cy - h / 2);
    ctx.lineTo(cx - nw / 2, cy + bh / 2 - h / 2 + nh * 0.25);
    ctx.quadraticCurveTo(cx - nw / 2, cy + bh / 2 - h / 2 + nh * 0.5, cx - w / 2, cy + bh / 2 - h / 2 + nh * 0.5);
    ctx.lineTo(cx - w / 2 + 6, cy + h / 2 - 8);
    ctx.quadraticCurveTo(cx, cy + h / 2 + 6, cx + w / 2 - 6, cy + h / 2 - 8);
    ctx.lineTo(cx + w / 2, cy + bh / 2 - h / 2 + nh * 0.5);
    ctx.quadraticCurveTo(cx + nw / 2, cy + bh / 2 - h / 2 + nh * 0.5, cx + nw / 2, cy + bh / 2 - h / 2 + nh * 0.25);
    ctx.lineTo(cx + nw / 2, cy - h / 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.lite;
    roundRect(cx - nw / 2 - 5, cy - h / 2 - 8, nw + 10, 10, 3);
    ctx.fill();
  } else if (shapeKey === 'bowl') {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, cy - h / 2);
    ctx.bezierCurveTo(cx - w / 2 + 4, cy + h / 2, cx + w / 2 - 4, cy + h / 2, cx + w / 2, cy - h / 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.lite;
    ctx.beginPath();
    ctx.ellipse(cx, cy - h / 2, w / 2, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  } else {
    const nk = w * 0.30;
    ctx.beginPath();
    ctx.moveTo(cx - nk, cy - h / 2);
    ctx.bezierCurveTo(cx - nk - 8, cy - h / 2 + h * 0.16, cx - w / 2 + 2, cy - h * 0.05, cx - w / 2, cy + h * 0.25);
    ctx.bezierCurveTo(cx - w / 2 + 4, cy + h / 2 - 6, cx + w / 2 - 4, cy + h / 2 - 6, cx + w / 2, cy + h * 0.25);
    ctx.bezierCurveTo(cx + w / 2 - 2, cy - h * 0.05, cx + nk + 8, cy - h / 2 + h * 0.16, cx + nk, cy - h / 2);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.lite;
    roundRect(cx - nk - 8, cy - h / 2 - 8, nk * 2 + 16, 12, 5);
    ctx.fill();
  }

  ctx.beginPath();
  ctx.ellipse(cx - w * 0.16, cy - h * 0.18, w * 0.13, h * 0.2, -0.5, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();

  if (cracked) {
    ctx.strokeStyle = 'rgba(20,25,35,0.85)';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - w * 0.2, cy - h * 0.3);
    ctx.lineTo(cx - w * 0.05, cy - h * 0.05);
    ctx.lineTo(cx - w * 0.18, cy + h * 0.25);
    ctx.lineTo(cx + w * 0.25, cy + h * 0.1);
    ctx.stroke();
  }
  ctx.restore();
}

function drawGauge(id, x, y, w, h, frac, zones, markerCol, label, danger) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  roundRect(x - 3, y - 3, w + 6, h + 6, 9);
  ctx.fill();
  const track = ctx.createLinearGradient(x, y, x + w, y);
  track.addColorStop(0, '#1e150e');
  track.addColorStop(1, '#2a1d12');
  ctx.fillStyle = track;
  roundRect(x, y, w, h, 6);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) {
    const tx = x + (i / 10) * w;
    ctx.beginPath(); ctx.moveTo(tx, y + h - 5); ctx.lineTo(tx, y + h); ctx.stroke();
  }

  for (const z of zones || []) {
    const zx = x + z.c * w - z.half * w;
    const pulse = 0.26 + Math.sin(game.time * 6) * 0.08;
    ctx.fillStyle = danger ? `rgba(255,120,90,${pulse})` : `rgba(120,225,145,${pulse})`;
    ctx.strokeStyle = danger ? 'rgba(255,140,110,0.7)' : 'rgba(140,240,165,0.7)';
    ctx.lineWidth = 1.5;
    roundRect(zx, y, z.half * 2 * w, h, 5);
    ctx.fill(); ctx.stroke();
  }

  const ex = clamp(easeMarker(id, frac), 0, 1);
  ctx.fillStyle = markerCol;
  roundRect(x + ex * w - 3.5, y - 5, 7, h + 10, 3.5);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (label) {
    ctx.fillStyle = 'rgba(255,246,220,0.75)';
    ctx.font = 'bold 13px Georgia';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + w / 2, y - 12);
  }
  ctx.restore();
}

function drawParticles() {
  for (const s of game.sparks) {
    ctx.globalAlpha = clamp(1 - s.t / s.life, 0, 1);
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r || 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  for (const s of game.shards) {
    ctx.globalAlpha = clamp(1 - s.t / s.life, 0, 1);
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.r, s.y + s.r * 1.5);
    ctx.lineTo(s.x - s.r, s.y + s.r);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

      maxed ? `${up.name} — FULL` : `${up.name}  ${fmt(cost)}`,
      afford,
      () => { save.money -= cost; save.up[up.key]++; persist(); beep(600, 0.1, 'triangle', 0.1); }, true);
    ctx.font = '12px Georgia';
    ctx.fillStyle = maxed ? 'rgba(160,220,160,0.7)' : 'rgba(255,255,255,0.55)';
    ctx.fillText(up.desc, ux + 102, uy + 56);
    ux += 225;
  }

  const cx = 717;
  ctx.font = 'bold 14px Georgia';
  ctx.fillStyle = '#ffdf9e';
  ctx.textAlign = 'left';
  ctx.fillText('GLASS COLORS', cx, 494);
  let cy = 504;
  for (const key of Object.keys(COLORS)) {
    const c = COLORS[key];
    const owned = save.unlocked.includes(key);
    const afford = save.money >= c.price;
    button(cx, cy, 205, 26,
      owned ? `${c.name} ✓` : `${c.name}  ${fmt(c.price)}`,
      !owned && afford,
      owned ? null : () => { save.money -= c.price; save.unlocked.push(key); persist(); beep(700, 0.12, 'triangle', 0.12); }, true);
    cy += 32;
  }
}

function coldWarn() {
  if (game.temp < 25 && (game.phase === PHASE_BLOW || game.phase === PHASE_SHAPE)) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px Georgia';
    ctx.fillStyle = `rgba(255,110,70,${0.5 + Math.sin(game.time * 10) * 0.3})`;
    ctx.fillText('⚠ glass is freezing — work fast!', W / 2, 442);
  }
}

function drawHeat() {
  drawBackground();
  drawFurnace();
  drawPipe();
  drawMoltenGather();
  drawParticles();
  drawHUD();

  const tempFrac = clamp(game.temp / 110, 0, 1);
  drawGauge('heat', W / 2 - 220, 510, 440, 26, tempFrac,
    [{ c: 80 / 110, half: 10 / 110 }], '#ffcf6b',
    'FURNACE HEAT — release inside the green', game.temp > 100);
  drawHint('Hold to heat the gather', 'release inside the green · too hot and it drips off the pipe');
}

function drawBlow() {
  drawBackground();
  drawFurnace();
  drawPipe();
  drawMoltenGather();
  drawParticles();
  drawHUD();

  const target = SIZES[game.order.size].target;
  const maxR = target * 1.38;
  const zones = save.up.gauge > 0 ? [{ c: target / maxR, half: 9 / maxR }] : [];
  drawGauge('blow', W / 2 - 220, 510, 440, 26, clamp(game.size / maxR, 0, 1), zones, '#8fb8ff',
    save.up.gauge > 0 ? 'BUBBLE SIZE — release inside the green' : 'BUBBLE SIZE — calipers would reveal the target',
    game.size > target * 1.22);
  coldWarn();
  drawHint('Hold to blow the bubble', 'the heat fades as you work — overblow it and it pops');
}

function drawShape() {
  drawBackground();
  drawFurnace();
  drawPipe();
  drawMoltenGather();
  drawParticles();
  drawHUD();

  const n = game.zones.length;
  const done = game.tapsDone;
  drawHint(done === 0 ? 'Shape the piece — tap in the green zones'
    : (game.phase === PHASE_SHAPE ? `Shaping… ${done}/${n} pulls done` : 'Shaped!'),
    done === 0 ? 'each pull narrows the zone and speeds the pointer' : 'keep the rhythm');
  if (game.phase === PHASE_SHAPE) {
    const z = game.zones[done];
    if (z) drawGauge('shape' + done, W / 2 - 220, 510, 440, 26, game.pointer,
      [{ c: z.c, half: z.half }], '#ffcf6b', `PULL ${done + 1} of ${n}`);
  } else {
    drawGauge('shapeDone', W / 2 - 220, 510, 440, 26, 1, [], '#8fd48f', 'SHAPED');
  }
  coldWarn();
}

function drawAnneal() {
  drawBackground();
  drawFurnace();
  drawPipe();
  drawMoltenGather();
  drawParticles();
  drawHUD();

  const frac = clamp(game.temp / 100, 0, 1);
  drawGauge('anneal', W / 2 - 220, 510, 440, 26, frac,
    [{ c: (ANN_WINDOW.lo + ANN_WINDOW.hi) / 2 / 100, half: (ANN_WINDOW.hi - ANN_WINDOW.lo) / 2 / 100 }],
    '#9fc4ff', 'KILN COOLING — tap when the marker is inside', game.temp > 72);
  drawHint('Anneal it', 'tap inside the window — touch it too hot or too cold and it may crack');
}

function drawResult() {
  drawBackground();
  drawHUD();

  const o = game.order;
  const q = game.fail ? 0 : quality(o);

  if (!game.fail && q >= 92 && Math.random() < 0.2) sparkleAt(W / 2 + rand(-90, 90), 340 + rand(-70, 70));
  drawParticles();

  ctx.textAlign = 'center';
  ctx.font = 'bold 32px Georgia';
  ctx.fillStyle = game.fail ? '#ff8f6b' : q >= 92 ? '#ffd75e' : '#ffdf9e';
  ctx.fillText(game.fail ? 'Ruined!' : game.rating, W / 2, 130);

  if (game.fail) {
    ctx.font = '17px Georgia';
    ctx.fillStyle = 'rgba(255,246,220,0.75)';
    ctx.fillText(game.message, W / 2, 166);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(W / 2, 452, 64, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = 'italic 14px Georgia';
    ctx.fillStyle = 'rgba(255,246,220,0.5)';
    ctx.fillText('sweep up and try again', W / 2, 486);
  } else {
    drawPiece(W / 2, 330, o.color, o.shape, SIZES[o.size].target, q < 40);

    const stages = [
      ['heat', game.scores.heat, '#ffcf6b'],
      ['blow', game.scores.blow, '#8fb8ff'],
      ['shape', game.scores.shape, '#bfe8ff'],
      ['anneal', game.scores.anneal, '#9fe8a8'],
    ];
    const bx = W / 2 - 180, by = 418;
    ctx.font = '12px Georgia';
    ctx.textAlign = 'right';
    stages.forEach((st, i) => {
      const y = by + i * 22;
      ctx.fillStyle = 'rgba(255,246,220,0.7)';
      ctx.fillText(st[0], bx - 10, y + 11);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(bx, y, 220, 12, 4); ctx.fill();
      ctx.fillStyle = st[2];
      roundRect(bx, y, clamp(st[1] / 100, 0, 1) * 220, 12, 4); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      ctx.textAlign = 'left';
      ctx.fillText(st[1], bx + 230, y + 11);
      ctx.textAlign = 'right';
    });
    ctx.textAlign = 'center';

    let ly = by + 4 * 22 + 26;
    ctx.font = '15px Georgia';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(`quality ${q}/100`, W / 2, ly); ly += 26;
    if (game.streakBonus > 0) {
      ctx.fillStyle = '#ffb35c';
      ctx.fillText(`streak bonus +${fmt(game.streakBonus)}`, W / 2, ly); ly += 26;
    }
    if (q >= 92) {
      ctx.fillStyle = '#ffd75e';
      ctx.fillText('masterwork bonus! ×1.25', W / 2, ly); ly += 26;
    }
    ctx.font = 'bold 26px Georgia';
    ctx.fillStyle = '#9fe8a8';
    ctx.fillText('+' + fmt(game.pay), W / 2, ly + 4);
  }

  ctx.font = 'bold 17px Georgia';
  ctx.fillStyle = `rgba(255,223,158,${0.6 + Math.sin(game.time * 4) * 0.3})`;
  ctx.fillText('click or press Space for the next commission', W / 2, 600);
}

/* ============================== main loop ============================== */

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (game.shake > 0) {
    ctx.translate(rand(-game.shake, game.shake) * 0.5, rand(-game.shake, game.shake) * 0.5);
  }
  switch (game.phase) {
    case PHASE_TITLE: drawTitle(); break;
    case PHASE_SHOP: drawShop(); break;
    case PHASE_HEAT: drawHeat(); break;
    case PHASE_BLOW: drawBlow(); break;
    case PHASE_SHAPE:
    case '_shaping': drawShape(); break;
    case PHASE_ANNEAL: drawAnneal(); break;
    case PHASE_RESULT: drawResult(); break;
  }
  if (game.flash > 0) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = `rgba(255,230,180,${game.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

loadSave();
requestAnimationFrame(frame);
</script>
</body>
</html>
